name: Temporary validated Daily publish 2026-09-22

on:
  push:
    branches:
      - content/daily-20260922-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Load reviewed Daily builder and generate from latest main baseline
        shell: bash
        run: |
          set -euo pipefail
          git show origin/content/daily-20260922-auto:scripts/_publish_daily_20260922.py > scripts/_runtime_publish_daily_20260922.py
          python scripts/_runtime_publish_daily_20260922.py
          rm scripts/_runtime_publish_daily_20260922.py
      - name: Normalize customs taxonomy fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/reports.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          row = next(r for r in data['reports'] if r.get('id') == '2026-09-22-daily')
          for signal in row.get('intelligence', {}).get('regulatory_structural', []):
              if signal.get('id') == 'japan-customs-naccs':
                  signal['customs_subtype'] = 'operational'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install DOM test dependency
        run: npm install --no-audit --no-fund
      - name: Static and DOM regression tests
        run: npm test
      - name: Report validation
        run: python scripts/validate-report.py
      - name: Report cost snapshot policy
        run: python scripts/validate-report-cost-snapshot.py
      - name: Public schema integrity
        run: python scripts/validate_public_schema_integrity.py
      - name: Customs taxonomy integrity
        run: python scripts/validate-customs-taxonomy.py
      - name: Logistics demand-capacity integrity
        run: python scripts/validate_logistics_structure.py
      - name: JSON, registry-preservation, path and shell sanity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              'data/reports.json',
              'data/critical-news.json',
              'data/topic-intelligence.json',
              'data/economy/ocean-freight-market.json',
              'data/economy/beauty-market.json',
          ]
          for name in files:
              json.loads(Path(name).read_text(encoding='utf-8'))
          reports = json.loads(Path('data/reports.json').read_text(encoding='utf-8'))['reports']
          ids = [r.get('id') for r in reports]
          assert len(ids) == len(set(ids)), 'duplicate report IDs'
          assert '2026-09-21-daily' in ids, 'previous Daily disappeared'
          assert '2026-09-22-daily' in ids, 'new Daily missing'
          row = next(r for r in reports if r.get('id') == '2026-09-22-daily')
          assert row['path'] == 'reports/2026/09/2026-09-22-daily.html'
          customs = [s for s in row.get('intelligence', {}).get('regulatory_structural', []) if s.get('id') == 'japan-customs-naccs']
          assert customs and customs[0].get('customs_subtype') == 'operational'
          p = Path(row['path'])
          assert p.exists(), p
          html = p.read_text(encoding='utf-8')
          assert 'data-report-date="2026-09-22"' in html
          assert 'data-report-type="daily"' in html
          assert 'id="tool-help" title="キーボードショートカット"' in html
          assert '{{' not in html and '}}' not in html
          assert html.count('class="changes"') == 1
          print('JSON/registry/path/canonical-shell sanity passed')
          PY
      - name: Commit generated content only
        shell: bash
        run: |
          set -euo pipefail
          expected='data/critical-news.json data/economy/beauty-market.json data/economy/ocean-freight-market.json data/reports.json data/topic-intelligence.json reports/2026/09/2026-09-22-daily.html'
          git add data/critical-news.json data/economy/beauty-market.json data/economy/ocean-freight-market.json data/reports.json data/topic-intelligence.json reports/2026/09/2026-09-22-daily.html
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected generated file scope"
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'publish: 2026-09-22 Daily Exception Intelligence'
          git push
