name: Validate report cost snapshots

on:
  pull_request:
    paths:
      - "data/reports.json"
      - "data/report-required-metrics.json"
      - "scripts/validate-report-cost-snapshot.py"
  push:
    branches: [main]
    paths:
      - "data/reports.json"
      - "data/report-required-metrics.json"
      - "scripts/validate-report-cost-snapshot.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-report-cost-snapshot.py
