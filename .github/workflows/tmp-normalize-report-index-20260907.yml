name: Temporary Report Index Normalization
on:
  push:
    branches:
      - content/weekly-20260907
    paths:
      - .github/workflows/tmp-normalize-report-index-20260907.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-20260907
          fetch-depth: 0
      - name: Preserve historical report-index formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          current = json.loads(Path('data/reports.json').read_text(encoding='utf-8'))
          new = next(r for r in current['reports'] if r.get('id') == '2026-09-07-weekly')
          prev = next(r for r in current['reports'] if r.get('id') == '2026-08-31-weekly')
          base = subprocess.check_output(['git','show','origin/main:data/reports.json'], text=True)
          marker = '  "reports": [\n'
          if marker not in base: raise SystemExit('reports marker missing on main')
          payload = ',\n'.join('    ' + json.dumps(x, ensure_ascii=False, separators=(',', ':')) for x in (new, prev))
          out = base.replace(marker, marker + payload + ',\n', 1)
          parsed = json.loads(out)
          assert sum(r.get('id')=='2026-09-07-weekly' for r in parsed['reports']) == 1
          assert sum(r.get('id')=='2026-08-31-weekly' for r in parsed['reports']) == 1
          Path('data/reports.json').write_text(out, encoding='utf-8')
          PY
          python scripts/validate-report-cost-snapshot.py
      - name: Commit normalized index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reports.json
          git commit -m "chore: preserve report index history formatting [skip ci]"
          git push origin HEAD:content/weekly-20260907
