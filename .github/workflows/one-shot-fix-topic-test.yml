name: One-shot repair regression baseline

on:
  push:
    branches:
      - fix/dynamic-topic-regression-count

permissions:
  contents: write

jobs:
  fix-validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair stale assertions and missing Daily intelligence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          test = Path('tests/dom-smoke.mjs')
          s = test.read_text(encoding='utf-8')
          s = s.replace('console.log("\\n[topic] middle-east-maritime-risk (4 developments, 4 data points)");', 'console.log("\\n[topic] middle-east-maritime-risk");')
          old = '  ok("developments rendered as a chronology", d.querySelectorAll(".development").length === 4);'
          new = '  {\n    const topic = DATA.topics.find((t) => t.topic_id === "middle-east-maritime-risk") || {};\n    ok("developments rendered as a chronology",\n      d.querySelectorAll(".development").length === (topic.developments || []).length,\n      String(d.querySelectorAll(".development").length) + " vs " + String((topic.developments || []).length));\n  }'
          if old in s:
              s = s.replace(old, new)
          elif '(topic.developments || []).length' not in s:
              raise SystemExit('topic chronology assertion is neither old nor repaired')
          test.write_text(s, encoding='utf-8')

          validator = Path('scripts/validate-report.py')
          v = validator.read_text(encoding='utf-8')
          old_v = '''        has_full = 'class="changes"' in html\n        has_none = 'changes--none' in html'''
          new_v = '''        class_tokens = [token for value in re.findall(r'class="([^"]*)"', html) for token in value.split()]\n        has_full = "changes" in class_tokens\n        has_none = "changes--none" in class_tokens'''
          if old_v in v:
              v = v.replace(old_v, new_v)
          elif 'class_tokens = [token for value in re.findall' not in v:
              raise SystemExit('report change-component validator target not found')
          validator.write_text(v, encoding='utf-8')

          p = Path('data/reports.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          entry = next((r for r in data['reports'] if r.get('id') == '2026-09-21-daily'), None)
          if not entry:
              raise SystemExit('2026-09-21-daily not found')
          if not entry.get('intelligence'):
              entry['intelligence'] = {
                  'disruption': [{
                      'id': 'japan-domestic-delivery',
                      'signal': '台風25号により関東、とくに千葉方面の道路・航空・島しょ輸送に実影響。複数高速道路の通行止めと八丈島・青ヶ島向け配送遅延を確認。',
                      'lens': 'disruption',
                      'direction': 'rising',
                      'impact': 'high',
                      'change_status': 'new',
                      'confidence': 'high',
                      'evidence': [
                          {'source': 'NEXCO東日本', 'date': '2026-09-21', 'url': 'https://www.e-nexco.co.jp/pressroom/'},
                          {'source': 'ヤマト運輸', 'date': '2026-09-21', 'url': 'https://www.kuronekoyamato.co.jp/ytc/chien/chien_hp.html'}
                      ],
                      'operational_implication': '千葉・房総方面、成田空港経由、島しょ向けは標準lead timeを前提にせずshipment単位で確認する。'
                  }],
                  'cost_capacity': [],
                  'reliability': [],
                  'demand_commerce': [],
                  'regulatory_structural': []
              }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Exact repository validation
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm test
          python scripts/validate-report.py
          python scripts/validate-report-cost-snapshot.py
          python scripts/validate_public_schema_integrity.py
          python scripts/validate-customs-taxonomy.py
          python scripts/validate_logistics_structure.py
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-topic-test.yml
          git add tests/dom-smoke.mjs scripts/validate-report.py data/reports.json
          git commit -m "fix: repair regression and report validation baseline"
          git push
