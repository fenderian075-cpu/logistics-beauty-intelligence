name: Patch radar mobile layout
on:
  push:
    branches: [fix/radar-mobile-overlap-v2]
    paths: ['.github/workflows/_patch-radar-mobile.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/radar-mobile-overlap-v2
      - name: Patch shared radar component
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/components.css')
          s = p.read_text()
          old = '''  .radar-row__head { grid-template-columns: 46px 42px minmax(0, 1fr); row-gap: 2px; }\n  .radar-row__domain { grid-row: 2; grid-column: 1 / 3; }\n  .radar-row__headline { grid-row: 2; grid-column: 3; }\n  .radar-row__jp { grid-row: 1; grid-column: 3; text-align: right; }'''
          new = '''  .radar-row__head {\n    grid-template-columns: 72px 52px minmax(0, 1fr);\n    column-gap: 10px;\n    row-gap: 3px;\n  }\n  .radar-row__state {\n    width: 72px;\n    min-width: 72px;\n    justify-self: start;\n    text-align: left;\n    overflow: visible;\n    white-space: nowrap;\n  }\n  .radar-row__date {\n    width: 52px;\n    min-width: 52px;\n    justify-self: start;\n    text-align: left;\n    white-space: nowrap;\n  }\n  .radar-row__domain { grid-row: 2; grid-column: 1 / 3; }\n  .radar-row__headline { grid-row: 2; grid-column: 3; }\n  .radar-row__jp { grid-row: 1; grid-column: 3; text-align: right; }'''
          if old not in s:
              raise SystemExit('target mobile radar block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/_patch-radar-mobile.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/css/components.css .github/workflows/_patch-radar-mobile.yml
          git commit -m "fix: prevent mobile radar status overlap"
          git push origin HEAD:fix/radar-mobile-overlap-v2
