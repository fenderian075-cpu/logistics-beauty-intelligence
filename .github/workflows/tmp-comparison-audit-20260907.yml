name: Temporary Comparison Audit
on:
  push:
    branches:
      - content/weekly-20260907
    paths:
      - .github/workflows/tmp-comparison-audit-20260907.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-20260907
      - name: Make comparison bases explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          report_path = Path('reports/2026/09/2026-09-07-weekly.html')
          report = report_path.read_text(encoding='utf-8')
          replacements = {
            'WoW +9.0%（同）': 'WoW +9.0%（2026-09-03 vs 2026-08-27）',
            '国際航空貨物YoY +2.7%（同）': '国際航空貨物YoY +2.7%（2026-06 vs 2025-06）',
            'MoM +0.59日（同）': 'MoM +0.59日（2026-07 vs 2026-06）',
            '店数調整後YoY +1.8%（同）': '店数調整後YoY +1.8%（2026-06 vs 2025-06）',
            'YoY +2.0%（同）。国際航空貨物は140,199t、YoY +2.7%（同）': 'YoY +2.0%（2026-06 vs 2025-06）。国際航空貨物は140,199t、YoY +2.7%（2026-06 vs 2025-06）',
            'Producer shipment +6.3%に対しdepartment-store cosmetics sell-through +1.8%': 'Producer shipment YoY +6.3%（2026-06 vs 2025-06）に対しdepartment-store cosmetics sell-through 店数調整後YoY +1.8%（2026-06 vs 2025-06）',
            'YoY +15.8%（同）': 'YoY +15.8%（2026-07 vs 2025-07）',
            '海運売上YoY +29.0%、航空売上YoY +25.4%、倉庫売上YoY -0.9%（同）': '海運売上YoY +29.0%（2026-07 vs 2025-07）、航空売上YoY +25.4%（2026-07 vs 2025-07）、倉庫売上YoY -0.9%（2026-07 vs 2025-07）',
          }
          for old, new in replacements.items():
              report = report.replace(old, new)
          report_path.write_text(report, encoding='utf-8')

          overview_path = Path('data/economy/overview.json')
          overview = overview_path.read_text(encoding='utf-8')
          overview = overview.replace('輸入597,836TEU、YoY +2.0%、輸出597,388TEU、YoY 0.0%（同）', '輸入597,836TEU、YoY +2.0%（2026-06 vs 2025-06）、輸出597,388TEU、YoY 0.0%（2026-06 vs 2025-06）')
          overview = overview.replace('外航貨物輸送259.5、YoY +67.4%（同）', '外航貨物輸送259.5、YoY +67.4%（2026-07 vs 2025-07）')
          overview = overview.replace('国内航空貨物45,614t、YoY -5.7%（同）', '国内航空貨物45,614t、YoY -5.7%（2026-06 vs 2025-06）')
          overview_path.write_text(overview, encoding='utf-8')

          reports_path = Path('data/reports.json')
          data = json.loads(reports_path.read_text(encoding='utf-8'))
          latest = next(r for r in data['reports'] if r.get('id') == '2026-09-07-weekly')
          def walk(v):
              if isinstance(v, str):
                  v = v.replace('WoW +9.0%（同）', 'WoW +9.0%（2026-09-03 vs 2026-08-27）')
                  v = v.replace('国際航空貨物YoY +2.7%（同）', '国際航空貨物YoY +2.7%（2026-06 vs 2025-06）')
                  v = v.replace('MoM +0.59日。', 'MoM +0.59日（2026-07 vs 2026-06）。')
                  v = v.replace('IACI WoW +9.0%（同）', 'IACI WoW +9.0%（2026-09-03 vs 2026-08-27）')
                  return v
              if isinstance(v, list): return [walk(x) for x in v]
              if isinstance(v, dict): return {k:walk(x) for k,x in v.items()}
              return v
          fixed = walk(latest)
          # Replace only the compact first entry to preserve all prior history formatting/content.
          raw = reports_path.read_text(encoding='utf-8')
          old_compact = json.dumps(latest, ensure_ascii=False, separators=(',', ':'))
          new_compact = json.dumps(fixed, ensure_ascii=False, separators=(',', ':'))
          if old_compact not in raw:
              raise SystemExit('latest compact report entry not found')
          reports_path.write_text(raw.replace(old_compact, new_compact, 1), encoding='utf-8')

          json.loads(overview_path.read_text(encoding='utf-8'))
          parsed = json.loads(reports_path.read_text(encoding='utf-8'))
          latest2 = next(r for r in parsed['reports'] if r.get('id') == '2026-09-07-weekly')
          assert '（同）' not in report_path.read_text(encoding='utf-8')
          assert '（同）' not in json.dumps(latest2, ensure_ascii=False)
          assert '（同）' not in overview_path.read_text(encoding='utf-8')
          PY
      - name: Commit comparison-standard fixes
        run: |
          if git diff --quiet -- reports/2026/09/2026-09-07-weekly.html data/reports.json data/economy/overview.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/2026/09/2026-09-07-weekly.html data/reports.json data/economy/overview.json
          git commit -m "fix: make Weekly comparison bases explicit [skip ci]"
          git push origin HEAD:content/weekly-20260907
