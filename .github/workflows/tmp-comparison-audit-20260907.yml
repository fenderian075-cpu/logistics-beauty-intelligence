name: Temporary Comparison Audit
on:
  push:
    branches:
      - content/weekly-20260907
    paths:
      - .github/workflows/tmp-comparison-audit-20260907.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-20260907
      - name: Make comparison bases explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_all(text, pairs):
              for old, new in pairs:
                  text = text.replace(old, new)
              return text

          report_path = Path('reports/2026/09/2026-09-07-weekly.html')
          report = report_path.read_text(encoding='utf-8')
          report_pairs = [
              ('WoW +9.0%（同）', 'WoW +9.0%（2026-09-03 vs 2026-08-27）'),
              ('国際航空貨物YoY +2.7%（同）', '国際航空貨物YoY +2.7%（2026-06 vs 2025-06）'),
              ('MoM +0.59日（同）', 'MoM +0.59日（2026-07 vs 2026-06）'),
              ('店数調整後YoY +1.8%（同）', '店数調整後YoY +1.8%（2026-06 vs 2025-06）'),
              ('YoY +2.0%（同）', 'YoY +2.0%（2026-06 vs 2025-06）'),
              ('YoY +2.7%（同）', 'YoY +2.7%（2026-06 vs 2025-06）'),
              ('YoY +15.8%（同）', 'YoY +15.8%（2026-07 vs 2025-07）'),
              ('YoY -0.9%（同）', 'YoY -0.9%（2026-07 vs 2025-07）'),
              ('Producer shipment +6.3%に対しdepartment-store cosmetics sell-through +1.8%', 'Producer shipment YoY +6.3%（2026-06 vs 2025-06）に対しdepartment-store cosmetics sell-through 店数調整後YoY +1.8%（2026-06 vs 2025-06）'),
              ('百貨店化粧品の同月YoY +1.8%との乖離', '百貨店化粧品の店数調整後YoY +1.8%（2026-06 vs 2025-06）との乖離'),
              ('海運売上YoY +29.0%、航空売上YoY +25.4%、倉庫売上YoY -0.9%（2026-07 vs 2025-07）', '海運売上YoY +29.0%（2026-07 vs 2025-07）、航空売上YoY +25.4%（2026-07 vs 2025-07）、倉庫売上YoY -0.9%（2026-07 vs 2025-07）'),
          ]
          report = replace_all(report, report_pairs)
          report_path.write_text(report, encoding='utf-8')

          overview_path = Path('data/economy/overview.json')
          overview = overview_path.read_text(encoding='utf-8')
          overview_pairs = [
              ('輸入597,836TEU、YoY +2.0%、輸出597,388TEU、YoY 0.0%（同）', '輸入597,836TEU、YoY +2.0%（2026-06 vs 2025-06）、輸出597,388TEU、YoY 0.0%（2026-06 vs 2025-06）'),
              ('外航貨物輸送259.5、YoY +67.4%（同）', '外航貨物輸送259.5、YoY +67.4%（2026-07 vs 2025-07）'),
              ('国内航空貨物45,614t、YoY -5.7%（同）', '国内航空貨物45,614t、YoY -5.7%（2026-06 vs 2025-06）'),
          ]
          overview = replace_all(overview, overview_pairs)
          overview_path.write_text(overview, encoding='utf-8')

          reports_path = Path('data/reports.json')
          raw = reports_path.read_text(encoding='utf-8')
          data = json.loads(raw)
          latest = next(r for r in data['reports'] if r.get('id') == '2026-09-07-weekly')
          def walk(v):
              if isinstance(v, str):
                  return replace_all(v, [
                      ('WoW +9.0%（同）', 'WoW +9.0%（2026-09-03 vs 2026-08-27）'),
                      ('YoY +2.0%（同）', 'YoY +2.0%（2026-06 vs 2025-06）'),
                      ('YoY +2.7%（同）', 'YoY +2.7%（2026-06 vs 2025-06）'),
                      ('YoY +1.8%（同）', 'YoY +1.8%（2026-06 vs 2025-06）'),
                      ('MoM +0.59日。', 'MoM +0.59日（2026-07 vs 2026-06）。'),
                      ('IACI WoW +9.0%（同）', 'IACI WoW +9.0%（2026-09-03 vs 2026-08-27）'),
                  ])
              if isinstance(v, list): return [walk(x) for x in v]
              if isinstance(v, dict): return {k: walk(x) for k, x in v.items()}
              return v
          fixed = walk(latest)
          old_compact = json.dumps(latest, ensure_ascii=False, separators=(',', ':'))
          new_compact = json.dumps(fixed, ensure_ascii=False, separators=(',', ':'))
          if old_compact not in raw:
              raise SystemExit('latest compact report entry not found')
          reports_path.write_text(raw.replace(old_compact, new_compact, 1), encoding='utf-8')

          # Validation: new publication and its snapshot must not use shorthand comparison bases.
          report_check = report_path.read_text(encoding='utf-8')
          overview_check = overview_path.read_text(encoding='utf-8')
          latest_check = next(r for r in json.loads(reports_path.read_text(encoding='utf-8'))['reports'] if r.get('id') == '2026-09-07-weekly')
          for name, text in [('report', report_check), ('overview', overview_check), ('latest-index', json.dumps(latest_check, ensure_ascii=False))]:
              if '（同）' in text:
                  i = text.index('（同）')
                  raise SystemExit(f'{name} still has shorthand near: {text[max(0,i-100):i+100]}')
          assert 'Producer shipment +6.3%' not in report_check
          assert '海運売上YoY +29.0%、' not in report_check
          json.loads(overview_check)
          PY
      - name: Commit comparison-standard fixes
        run: |
          if git diff --quiet -- reports/2026/09/2026-09-07-weekly.html data/reports.json data/economy/overview.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/2026/09/2026-09-07-weekly.html data/reports.json data/economy/overview.json
          git commit -m "fix: make Weekly comparison bases explicit [skip ci]"
          git push origin HEAD:content/weekly-20260907
