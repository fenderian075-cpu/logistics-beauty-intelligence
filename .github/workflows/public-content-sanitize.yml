name: Sanitize public content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sanitize_public_content.py"
      - "scripts/localize_source_matrices.py"
      - "scripts/localize_public_ui.py"
      - "scripts/audit_public_content.py"
      - ".github/workflows/public-content-sanitize.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanitize public data and HTML
        id: sanitize_data
        continue-on-error: true
        run: python scripts/sanitize_public_content.py

      - name: Localize extended source matrices
        id: localize_sources
        if: steps.sanitize_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/localize_source_matrices.py

      - name: Localize selected public UI literals
        id: localize_ui
        if: steps.sanitize_data.outcome == 'success' && steps.localize_sources.outcome == 'success'
        continue-on-error: true
        run: python scripts/localize_public_ui.py

      - name: Audit public privacy and Japanese UI
        id: audit
        if: steps.sanitize_data.outcome == 'success' && steps.localize_sources.outcome == 'success' && steps.localize_ui.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/audit_public_content.py > /tmp/public-audit.log 2>&1
          RC=$?
          cat /tmp/public-audit.log
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Validate customs taxonomy after localization
        id: customs
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validate-customs-taxonomy.py > /tmp/customs-audit.log 2>&1
          RC=$?
          cat /tmp/customs-audit.log
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Write public sanitizer status
        if: always()
        env:
          SANITIZE: ${{ steps.sanitize_data.outcome }}
          SOURCES: ${{ steps.localize_sources.outcome }}
          UI: ${{ steps.localize_ui.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          CUSTOMS: ${{ steps.customs.outcome }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
          CUSTOMS_EXIT: ${{ steps.customs.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          stages = {
              "sanitize_data": os.environ.get("SANITIZE") or "not_run",
              "localize_sources": os.environ.get("SOURCES") or "not_run",
              "localize_ui": os.environ.get("UI") or "not_run",
              "audit": os.environ.get("AUDIT") or "not_run",
              "customs_validation": os.environ.get("CUSTOMS") or "not_run",
          }
          ok = all(value == "success" for value in stages.values())
          failed_stage = next((name for name, value in stages.items() if value != "success"), None)
          audit_log = Path('/tmp/public-audit.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/public-audit.log').exists() else ''
          customs_log = Path('/tmp/customs-audit.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/customs-audit.log').exists() else ''
          diagnostic = audit_log if stages['audit'] == 'failure' else customs_log if stages['customs_validation'] == 'failure' else ''
          status = {
              "schema_version": "1.1",
              "dataset": "public-sanitize-status",
              "status": "success" if ok else "failure",
              "stage": "success" if ok else failed_stage,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "stages": stages,
              "audit_exit_code": os.environ.get("AUDIT_EXIT") or None,
              "customs_exit_code": os.environ.get("CUSTOMS_EXIT") or None,
              "diagnostic_tail": diagnostic[-8000:] if diagnostic else None,
              "note": "Public sanitizer health only; no private monitoring targets are stored here."
          }
          Path("data/public-sanitize-status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit sanitized output or diagnostic status
        if: always()
        shell: bash
        env:
          SANITIZE: ${{ steps.sanitize_data.outcome }}
          SOURCES: ${{ steps.localize_sources.outcome }}
          UI: ${{ steps.localize_ui.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          CUSTOMS: ${{ steps.customs.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$SANITIZE" == "success" && "$SOURCES" == "success" && "$UI" == "success" && "$AUDIT" == "success" && "$CUSTOMS" == "success" ]]; then
            git add -A
            MESSAGE="data: sanitize public Japanese and brand privacy"
          else
            git add data/public-sanitize-status.json
            MESSAGE="data: record public sanitizer failure"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$MESSAGE"
          git push

      - name: Fail when public sanitizer is unhealthy
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/public-sanitize-status.json", encoding="utf-8"))
          assert d["status"] == "success", f"public sanitizer failed at {d['stage']}: {d.get('diagnostic_tail')}"
          PY
