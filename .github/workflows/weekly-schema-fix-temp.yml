name: Temporary weekly schema cleanup

on:
  push:
    branches:
      - content/weekly-2026-09-21-v2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-2026-09-21-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unsupported optional enum values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reports.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=next(x for x in d['reports'] if x.get('id')=='2026-09-21-weekly')
          for s in r.get('intelligence',{}).get('demand_commerce',[]):
              if s.get('id')=='beauty-japan-ec-promotion':
                  s.pop('demand_driver',None)
                  s.pop('duration',None)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- data/reports.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          git commit -m "data: normalize Sep 21 weekly signal enums [skip ci]"
          git push origin HEAD:content/weekly-2026-09-21-v2
