name: Update Google Trends Buzz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-trends-buzz.yml'
      - 'scripts/update_google_trends.py'
      - 'data/buzz-watchlist.json'

permissions:
  contents: write

concurrency:
  group: google-trends-buzz
  cancel-in-progress: false

jobs:
  update-buzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install 'pytrends==4.9.2' pandas 'urllib3<2'
      - name: Update Beauty buzz data
        run: python3 scripts/update_google_trends.py
      - name: Commit data when changed
        run: |
          if git diff --quiet -- data/buzz.json; then
            echo "No Buzz data change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buzz.json
          git commit -m "data: update Google Trends beauty buzz"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            if ! git pull --rebase origin main; then
              echo "Rebase failed on attempt ${attempt}"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Buzz data pushed successfully"
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Push raced with another main update; retrying after refresh"
              sleep $((attempt * 3))
            fi
          done

          echo "Failed to push Buzz data after 3 attempts"
          exit 1
