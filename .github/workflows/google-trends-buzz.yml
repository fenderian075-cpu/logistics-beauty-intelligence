name: Update Google Trends Buzz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-buzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install pytrends pandas
      - name: Update Beauty buzz data
        run: python3 scripts/update_google_trends.py
      - name: Commit data when changed
        run: |
          if git diff --quiet -- data/buzz.json; then
            echo "No Buzz data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buzz.json
          git commit -m "data: update Google Trends beauty buzz"
          git push
