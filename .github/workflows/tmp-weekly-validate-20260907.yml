name: Temporary Weekly Validation
on:
  push:
    branches:
      - content/weekly-20260907
    paths:
      - .github/workflows/tmp-weekly-validate-20260907.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-20260907
      - name: Preserve existing schema versions and validate publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          fixes = {
              Path('data/economy/retail-beauty.json'): ('"schema_version": "1.4"', '"schema_version": "1.3"'),
              Path('data/economy/beauty-market.json'): ('"schema_version": "1.1"', '"schema_version": "1.0"'),
          }
          for p, (old, new) in fixes.items():
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
          for p in Path('data/economy').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          reports = json.loads(Path('data/reports.json').read_text(encoding='utf-8'))
          ids = [r.get('id') for r in reports.get('reports', [])]
          assert ids.count('2026-09-07-weekly') == 1
          assert ids.count('2026-08-31-weekly') == 1
          report = Path('reports/2026/09/2026-09-07-weekly.html').read_text(encoding='utf-8')
          assert '{{' not in report and '}}' not in report
          assert 'data-report-date="2026-09-07"' in report
          assert 'ECONOMIC &amp; PHYSICAL FLOW' in report
          assert 'WoW -0.2%（2026-09-03 vs 2026-08-27）' in report
          assert 'WoW +9.0%（2026-09-03 vs 2026-08-27）' in report
          assert 'MoM -6.1 percentage points（2026-07 vs 2026-06）' in report
          assert '../../../assets/js/app.js' in report
          PY
      - name: Commit schema-preservation fixes
        run: |
          if git diff --quiet -- data/economy/retail-beauty.json data/economy/beauty-market.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/economy/retail-beauty.json data/economy/beauty-market.json
          git commit -m "fix: preserve economy dataset schema versions [skip ci]"
          git push origin HEAD:content/weekly-20260907
