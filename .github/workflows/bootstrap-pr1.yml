name: Bootstrap PR1 Foundation

on:
  push:
    branches:
      - transfer/frontend-foundation-v5
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap: trigger PR1 apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply PR1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/pr1.patch.gz.b64
          base64 -d /tmp/pr1.patch.gz.b64 | gzip -d > /tmp/pr1.patch
          git apply --index /tmp/pr1.patch
          cp .bootstrap/README.md README.md
          git add README.md
      - name: Commit frontend foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Frontend foundation v5: deterministic ES modules and unified UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
