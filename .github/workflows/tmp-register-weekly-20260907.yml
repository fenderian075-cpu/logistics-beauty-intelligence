name: Temporary Weekly Index Registration
on:
  push:
    branches:
      - content/weekly-20260907
    paths:
      - .github/workflows/tmp-register-weekly-20260907.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/weekly-20260907
      - name: Insert report index entries without reformatting history
        env:
          NEW_Z: 
          PREV_Z: 
        run: |
          python - <<'PY'
          import os, json, zlib, base64
          from pathlib import Path
          p = Path('data/reports.json')
          text = p.read_text(encoding='utf-8')
          def unpack(name):
              return json.loads(zlib.decompress(base64.b64decode(os.environ[name])).decode('utf-8'))
          new = unpack('NEW_Z')
          prev = unpack('PREV_Z')
          entries = []
          if '"id":"2026-09-07-weekly"' not in text and '"id": "2026-09-07-weekly"' not in text:
              entries.append(new)
          if '"id":"2026-08-31-weekly"' not in text and '"id": "2026-08-31-weekly"' not in text:
              entries.append(prev)
          if entries:
              payload = ',\n'.join('    ' + json.dumps(e, ensure_ascii=False, separators=(',', ':')) for e in entries)
              needle = '  "reports": [\n'
              if needle not in text:
                  raise SystemExit('reports array marker not found')
              text = text.replace(needle, needle + payload + ',\n', 1)
              p.write_text(text, encoding='utf-8')
              json.loads(text)
          PY
      - name: Commit index update
        run: |
          if git diff --quiet -- data/reports.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reports.json
          git commit -m "data: register 2026-09-07 weekly [skip ci]"
          git push origin HEAD:content/weekly-20260907
