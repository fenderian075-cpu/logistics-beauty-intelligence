name: Validate customs taxonomy

on:
  push:
    branches: [main]
    paths:
      - "data/customs-regulation-taxonomy.json"
      - "data/source-matrix.json"
      - "data/reports.json"
      - "scripts/validate-customs-taxonomy.py"
      - ".github/workflows/customs-taxonomy.yml"
  pull_request:
    paths:
      - "data/customs-regulation-taxonomy.json"
      - "data/source-matrix.json"
      - "data/reports.json"
      - "scripts/validate-customs-taxonomy.py"
      - ".github/workflows/customs-taxonomy.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate customs operational/regulatory taxonomy
        run: python scripts/validate-customs-taxonomy.py
