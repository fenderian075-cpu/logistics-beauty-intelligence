name: Refresh logistics workforce structure

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 5 * *"
  push:
    paths:
      - "scripts/update_logistics_workforce_age.py"
      - "scripts/update_logistics_productivity.py"
      - "scripts/update_household_demand.py"
      - "scripts/update_trucking_physical_capacity.py"
      - "scripts/update_labor_capacity_stress.py"
      - "scripts/validate_logistics_structure.py"
      - "scripts/validate_household_demand.py"
      - "scripts/validate_foreign_workforce.py"
      - "scripts/validate_trucking_physical_capacity.py"
      - "scripts/validate_driver_labor_history.py"
      - "scripts/validate_labor_capacity_stress.py"
      - "data/economy/logistics-workforce-age.json"
      - "data/economy/logistics-capacity.json"
      - "data/economy/ec-demand.json"
      - "data/economy/household-demand.json"
      - "data/economy/logistics-foreign-workforce.json"
      - "data/economy/trucking-physical-capacity.json"
      - "data/economy/driver-labor-history.json"
      - "data/economy/labor-capacity-stress.json"
      - ".github/workflows/logistics-workforce-structure.yml"
  pull_request:
    paths:
      - "scripts/update_logistics_workforce_age.py"
      - "scripts/update_logistics_productivity.py"
      - "scripts/update_household_demand.py"
      - "scripts/update_trucking_physical_capacity.py"
      - "scripts/update_labor_capacity_stress.py"
      - "scripts/validate_logistics_structure.py"
      - "scripts/validate_household_demand.py"
      - "scripts/validate_foreign_workforce.py"
      - "scripts/validate_trucking_physical_capacity.py"
      - "scripts/validate_driver_labor_history.py"
      - "scripts/validate_labor_capacity_stress.py"
      - "data/economy/logistics-workforce-age.json"
      - "data/economy/logistics-capacity.json"
      - "data/economy/ec-demand.json"
      - "data/economy/household-demand.json"
      - "data/economy/logistics-foreign-workforce.json"
      - "data/economy/trucking-physical-capacity.json"
      - "data/economy/driver-labor-history.json"
      - "data/economy/labor-capacity-stress.json"
      - ".github/workflows/logistics-workforce-structure.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check openpyxl xlrd requests

      - name: Compile collectors
        run: python -m py_compile scripts/update_logistics_workforce_age.py scripts/update_logistics_productivity.py scripts/update_household_demand.py scripts/update_trucking_physical_capacity.py scripts/update_labor_capacity_stress.py scripts/validate_logistics_structure.py scripts/validate_household_demand.py scripts/validate_foreign_workforce.py scripts/validate_trucking_physical_capacity.py scripts/validate_driver_labor_history.py scripts/validate_labor_capacity_stress.py

      - name: Refresh official age and industry structure
        shell: bash
        run: |
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "ESTAT_APP_ID is not configured; keeping the last validated official dataset."
          else
            python scripts/update_logistics_workforce_age.py
          fi

      - name: Refresh official household demand base
        run: python scripts/update_household_demand.py

      - name: Derive freight and warehouse labor productivity
        run: python scripts/update_logistics_productivity.py

      - name: Refresh trucking physical capacity
        run: python scripts/update_trucking_physical_capacity.py

      - name: Derive labor capacity stress inputs
        run: python scripts/update_labor_capacity_stress.py

      - name: Validate structural datasets
        run: python scripts/validate_logistics_structure.py

      - name: Validate EC and household demand
        run: python scripts/validate_household_demand.py

      - name: Validate foreign logistics workforce
        run: python scripts/validate_foreign_workforce.py

      - name: Validate trucking physical capacity
        run: python scripts/validate_trucking_physical_capacity.py

      - name: Validate driver labor history
        run: python scripts/validate_driver_labor_history.py

      - name: Validate labor capacity stress
        run: python scripts/validate_labor_capacity_stress.py

      - name: Report structural state
        shell: bash
        run: |
          python - <<'PY'
          import json
          for file, mid in [
            ('data/economy/logistics-capacity.json','freight_labor_productivity'),
            ('data/economy/trucking-physical-capacity.json','ton_km_per_vehicle'),
            ('data/economy/driver-labor-history.json','large_truck_driver_annual_work_hours'),
            ('data/economy/labor-capacity-stress.json','labor_capacity_stress_equal_weight')]:
              d=json.load(open(file,encoding='utf-8')); s=next(x for x in d['series'] if x['metric_id']==mid); print(mid, (s.get('observations') or [None])[-1])
          PY

      - name: Commit refreshed structural data on source branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economy/logistics-workforce-age.json data/economy/logistics-capacity.json data/economy/household-demand.json data/economy/trucking-physical-capacity.json data/economy/labor-capacity-stress.json
          if git diff --cached --quiet; then
            echo "No structural data change."
            exit 0
          fi
          git commit -m "data: refresh logistics structural demand and workforce"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
