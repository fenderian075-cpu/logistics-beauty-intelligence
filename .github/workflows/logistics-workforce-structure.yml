name: Refresh logistics workforce structure

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 5 * *"
  push:
    paths:
      - "scripts/update_logistics_workforce_age.py"
      - "scripts/update_logistics_productivity.py"
      - "scripts/validate_logistics_structure.py"
      - "data/economy/logistics-workforce-age.json"
      - "data/economy/logistics-capacity.json"
      - ".github/workflows/logistics-workforce-structure.yml"
  pull_request:
    paths:
      - "scripts/update_logistics_workforce_age.py"
      - "scripts/update_logistics_productivity.py"
      - "scripts/validate_logistics_structure.py"
      - "data/economy/logistics-workforce-age.json"
      - "data/economy/logistics-capacity.json"
      - ".github/workflows/logistics-workforce-structure.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile collectors
        run: python -m py_compile scripts/update_logistics_workforce_age.py scripts/update_logistics_productivity.py scripts/validate_logistics_structure.py

      - name: Refresh official age and industry structure
        shell: bash
        run: |
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "ESTAT_APP_ID is not configured; keeping the last validated official dataset."
          else
            python scripts/update_logistics_workforce_age.py
          fi

      - name: Derive freight and warehouse labor productivity
        run: python scripts/update_logistics_productivity.py

      - name: Validate structural datasets
        run: python scripts/validate_logistics_structure.py

      - name: Report structural state
        shell: bash
        run: |
          python - <<'PY'
          import json
          age=json.load(open('data/economy/logistics-workforce-age.json', encoding='utf-8'))
          cap=json.load(open('data/economy/logistics-capacity.json', encoding='utf-8'))
          print('workforce age status:', age.get('status'))
          print('statsDataId:', age.get('api_contract',{}).get('stats_data_id'))
          print('populated age series:', sum(bool(s.get('observations')) for s in age.get('series',[])), '/', len(age.get('series',[])))
          for mid in ('freight_labor_productivity','warehouse_labor_productivity'):
              s=next(x for x in cap['series'] if x['metric_id']==mid)
              print(mid, 'observations:', len(s.get('observations',[])), 'latest:', (s.get('observations') or [None])[-1])
          PY

      - name: Commit refreshed structural data on source branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economy/logistics-workforce-age.json data/economy/logistics-capacity.json
          if git diff --cached --quiet; then
            echo "No structural data change."
            exit 0
          fi
          git commit -m "data: refresh logistics workforce structure"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
